#################################
#          Animations           #
#################################
animations = true;
animations = ({
  triggers = [ "open" ];
  preset = "appear";
},{
  triggers = [ "close" ];
  preset = "disappear";
})

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = false;
log-level = "warn";

#################################
#     Background-Blurring       #
#################################
blur: {
  method = "dual_kawase";
  strength = 4;
  background = false;
  background-frame = false;
  background-fixed = false;
}
blur-kern = "3x3box";

#################################
#          Experimental         #
#################################
experimental-backends = true;
unredir-if-possible = true;
glx-no-stencil = true;
glx-copy-from-front = false;

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.7;
shadow-offset-x = -15;
shadow-offset-y = -15;

#################################
#             Corners           #
#################################
corner-radius = 12;

#################################
#            Rules              #
#################################
rules = (
  # Focused windows
  {
    match = "focused || group_focused";
    opacity = 1.0;
  },
  # Unfocused windows
  {
    match = "!(focused || group_focused)";
    opacity = 0.92;
  },
  
  # Specific applications - full opacity
  {
    match = "class_g = 'librewolf'";
    opacity = 1.0;
  },
  {
    match = "class_g = 'Rofi'";
    opacity = 1.0;
  },
  {
    match = "class_g = 'mpv'";
    opacity = 1.0;
  },
  {
    match = "fullscreen";
    opacity = 1.0;
  },
  
  # Alacritty
  {
    match = "class_g = 'Alacritty' && focused";
    opacity = 0.9;
  },
  {
    match = "class_g = 'Alacritty' && !focused";
    opacity = 0.9;
  },
  
  # Frame opacity
  {
    match = "!focused && !group_focused";
    frame-opacity = 0.9;
  },
  
  # Focus exclusions
  {
    match = "class_g = 'Cairo-clock' || class_g = 'slop'";
    focus = true;
  },
  
  # Corner radius exclusions
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Rofi' || class_g = 'Dunst'";
    corner-radius = 0;
  },
  
  # Shadow exclusions
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || _GTK_FRAME_EXTENTS@:c || class_g = 'slop' || class_g = 'Polybar'";
    shadow = false;
  },
  
  # Blur exclusions
  {
    match = "window_type = 'dock' || window_type = 'desktop' || _GTK_FRAME_EXTENTS@:c || class_g = 'slop'";
    blur-background = false;
  },
  {
    match = "class_g = 'Eww'"
    opacity = 1.00;
  },
  
  # Window type specific settings
  {
    match = "window_type = 'tooltip'";
    fade = true;
    shadow = true;
    opacity = 0.95;
    full-shadow = false;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    clip-shadow-above = true;
  },
  {
    match = "window_type = 'dnd'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    opacity = 0.95;
    shadow = true;
    fade = true;
  },
  {
    match = "window_type = 'utility'";
    shadow = true;
    fade = true;
  },
  {
    match = "window_type = 'notification'";
    shadow = true;
    fade = true;
  },
  {
    match = "class_g = 'feh'";
    animations = (
      {
        triggers = [ "open", "show" ];
        duration = 0;
      },
      {
        triggers = [ "close", "hide" ];
        duration = 0;
      }
    )
  }
);

